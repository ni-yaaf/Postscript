<!doctype html>
<html lang="en" class="dark" data-paper="cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postscript — A Place for Words</title>
    <meta
      name="description"
      content="Some words deserve more than a comment. A quiet digital notebook for thoughtful letters and preserved correspondence."
    />
    <meta property="og:title" content="Postscript — A Place for Words" />
    <meta
      property="og:description"
      content="Some words deserve more than a comment. A quiet digital notebook for thoughtful letters and preserved correspondence."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('postscript_spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('postscript_spa_redirect');
            if (redirect !== location.href) {
              history.replaceState(null, '', redirect);
            }
          }
          var savedSettings = localStorage.getItem('postscript_v1_settings');
          if (savedSettings) {
            var parsed = JSON.parse(savedSettings);
            if (parsed && parsed.theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
            document.documentElement.dataset.paper =
              parsed && parsed.paperStyle === 'dark' ? 'dark' : 'cream';
          } else {
            document.documentElement.dataset.paper = 'cream';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
